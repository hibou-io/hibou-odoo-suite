repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: end-of-file-fixer
    -   id: check-ast
    -   id: check-builtin-literals
    -   id: check-xml
    -   id: check-yaml
    -   id: debug-statements
    -   id: requirements-txt-fixer
    -   id: mixed-line-ending
