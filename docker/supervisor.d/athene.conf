[program:athene]
command=/opt/athene/entrypoint.sh
autostart=false
autorestart=true
priority=30
environment=DEV_MODE="exclusive"
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/athene-stdout.log
stderr_logfile=/var/log/supervisor/athene-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
